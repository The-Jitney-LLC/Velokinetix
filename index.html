<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velo Kinetix Systems | Seamless System Solutions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.4; filter: drop-shadow(0 0 15px rgba(6, 182, 212, 0.6)); }
            50% { opacity: 0.9; filter: drop-shadow(0 0 35px rgba(59, 130, 246, 0.9)); }
        }
        @keyframes flow-light {
            0% { stroke-dashoffset: 200; }
            100% { stroke-dashoffset: 0; }
        }
        .fiber-path {
            animation: flow-light 3s linear infinite;
        }
        .infinity-glow {
            animation: pulse-glow 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-white">
    <!-- Top Navigation -->
    <header class="w-full border-b border-slate-800/80 bg-slate-900/40 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-500 to-indigo-500">
                    VELO KINETIX SYSTEMS
                </span>
            </div>
            <nav class="hidden md:flex space-x-8 text-sm font-medium text-slate-400">
                <a href="#solutions" class="hover:text-cyan-400 transition-colors">Solutions</a>
                <a href="#infrastructure" class="hover:text-cyan-400 transition-colors">Infrastructure</a>
                <a href="#contact" class="hover:text-cyan-400 transition-colors">Contact</a>
            </nav>
            <div>
                <a href="#contact" class="px-4 py-2 text-xs font-semibold uppercase tracking-wider text-cyan-300 border border-cyan-500/30 rounded-full hover:bg-cyan-500/10 transition-all">
                    System Portal
                </a>
            </div>
        </div>
    </header>

    <!-- Hero Section with Fiber-Optic Infinity Loop -->
    <main class="flex-grow flex items-center justify-center px-6 py-16">
        <div class="max-w-4xl w-full text-center">
            
            <!-- Fiber Optic Infinity Graphic -->
            <div class="relative w-full h-64 md:h-80 flex items-center justify-center mb-8">
                <!-- Background ambient glow -->
                <div class="absolute w-72 h-36 bg-cyan-500/10 rounded-full blur-3xl"></div>
                
                <svg class="w-full h-full infinity-glow max-w-md mx-auto" viewBox="0 0 400 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Dark optic track baseline -->
                    <path d="M120 100 C 60 20, 10 60, 10 100 C 10 140, 60 180, 120 100 C 180 20, 230 60, 230 100 C 230 140, 280 180, 340 100 C 380 50, 390 100, 390 100 C 390 100, 380 150, 340 100 C 280 20, 230 60, 230 100 C 230 140, 180 180, 120 100 C 60 20, 10 60, 10 100 Z" 
                          stroke="#1e293b" stroke-width="6" fill="none" stroke-linecap="round" />
                    
                    <!-- Glowing Core Fiber Optic Path -->
                    <path d="M120 100 C 60 20, 10 60, 10 100 C 10 140, 60 180, 120 100 C 180 20, 230 60, 230 100 C 230 140, 280 180, 340 100 C 380 50, 390 100, 390 100 C 390 100, 380 150, 340 100 C 280 20, 230 60, 230 100 C 230 140, 180 180, 120 100 C 60 20, 10 60, 10 100 Z" 
                          stroke="url(#fiber-gradient)" stroke-width="4" stroke-dasharray="25 15" fill="none" stroke-linecap="round" class="fiber-path" />
                    
                    <!-- Gradient Definition -->
                    <defs>
                        <linearGradient id="fiber-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#06b6d4" />
                            <stop offset="50%" stop-color="#3b82f6" />
                            <stop offset="100%" stop-color="#8b5cf6" />
                        </linearGradient>
                    </defs>
                </svg>
            </div>

            <!-- Title & Subtitle matching mood board -->
            <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight mb-4 text-white">
                Velo Kinetix Systems
            </h1>
            <p class="text-xl md:text-2xl font-light text-cyan-300/90 tracking-wide mb-10">
                Seamless System Solutions
            </p>

            <!-- Action buttons -->
            <div class="flex flex-col sm:flex-row justify-center items-center space-y-4 sm:space-y-0 sm:space-x-4">
                <a href="#solutions" class="w-full sm:w-auto px-8 py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-medium hover:from-cyan-400 hover:to-blue-500 transition-all shadow-lg shadow-cyan-500/20">
                    Explore Architecture
                </a>
                <a href="#contact" class="w-full sm:w-auto px-8 py-3 rounded-xl border border-slate-700 bg-slate-900/60 hover:bg-slate-800 text-slate-300 font-medium transition-all">
                    System Access
                </a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full border-t border-slate-900 py-6 text-center text-xs text-slate-600">
        © 2026 The Jitney LLC · Velo Kinetix Systems Infrastructure Hub. All rights reserved.
    </footer>
</body>
</html>
